<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无机化学 特训道场</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Microsoft YaHei",sans-serif;
  background:#eef6ff;
  background-image:
    radial-gradient(at 0% 0%, #cffafe 0px, transparent 55%),
    radial-gradient(at 100% 0%, #dbeafe 0px, transparent 55%),
    radial-gradient(at 50% 100%, #e0e7ff 0px, transparent 55%);
  background-attachment:fixed;
  min-height:100vh;color:#1e293b;padding:28px 16px 70px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;}

/* 顶部 */
.hero{text-align:center;margin-bottom:28px;}
.hero .icon{
  width:96px;height:96px;margin:0 auto 18px;border-radius:30px;
  background:linear-gradient(135deg,#0ea5e9,#6366f1,#a855f7);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 48px rgba(99,102,241,.42);
  animation:float 3.6s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.hero h1{font-size:30px;font-weight:900;letter-spacing:.5px;margin-bottom:6px;}
.hero .sub{font-size:15px;color:#6366f1;font-weight:800;margin-bottom:12px;letter-spacing:1px;}
.hero p{font-size:14px;color:#64748b;line-height:1.8;}

/* 统计 */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
@media(max-width:560px){.statrow{gap:8px;}}
.statbox{
  background:#fff;border-radius:20px;padding:18px 8px;text-align:center;
  border:1.5px solid #e8eeff;box-shadow:0 8px 24px rgba(99,102,241,.07);
}
.statbox b{font-size:26px;font-weight:900;color:#6366f1;display:block;line-height:1.15;}
.statbox small{font-size:11.5px;color:#94a3b8;letter-spacing:.5px;font-weight:700;}

/* 区块标题 */
.section-title{
  display:flex;align-items:center;gap:12px;margin:0 0 16px 4px;
  font-size:15px;font-weight:900;color:#475569;letter-spacing:.5px;
}
.section-title .bar{
  width:4px;height:18px;border-radius:2px;
  background:linear-gradient(180deg,#38bdf8,#6366f1);
}
.section-title small{font-size:12px;color:#94a3b8;font-weight:700;margin-left:4px;}

/* 模块网格 */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
  margin-bottom:30px;
}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;}}
@media(max-width:420px){.grid{grid-template-columns:1fr;}}

.module{
  background:#fff;border:2px solid #e8eeff;border-radius:20px;
  padding:20px 16px;text-align:center;cursor:pointer;
  transition:.22s cubic-bezier(.4,0,.2,1);font-family:inherit;
  box-shadow:0 8px 24px rgba(99,102,241,.06);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-height:140px;justify-content:center;
}
.module:not(.locked):hover{
  transform:translateY(-5px);border-color:#a5b4fc;
  box-shadow:0 16px 36px rgba(99,102,241,.2);
}
.module .micon{
  width:52px;height:52px;margin-bottom:6px;
  transition:.24s;display:flex;align-items:center;justify-content:center;
}
.module .micon svg{width:100%;height:100%;display:block;}
.module:not(.locked):hover .micon{transform:scale(1.12) rotate(-4deg);}
.module .mtitle{font-size:15px;font-weight:900;color:#334155;line-height:1.4;}
.module .mcn{font-size:11.5px;color:#94a3b8;font-weight:700;letter-spacing:.3px;}
.module .mstatus{
  font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:99px;
  margin-top:6px;letter-spacing:.5px;
}
.module.open{
  background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);
  border-color:transparent;color:#fff;
  box-shadow:0 14px 36px rgba(99,102,241,.38);
}
.module.open .mtitle{color:#fff;}
.module.open .mcn{color:rgba(255,255,255,.82);}
.module.open .mstatus{
  background:rgba(255,255,255,.24);color:#fff;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{background:rgba(255,255,255,.24);}
  50%{background:rgba(255,255,255,.42);}
}
.module.open:hover{
  transform:translateY(-6px);box-shadow:0 22px 48px rgba(99,102,241,.5);
}
.module.locked{
  background:#f8faff;border-color:#eef2ff;cursor:not-allowed;
  opacity:.72;
}
.module.locked .micon{opacity:.55;}
.module.locked .mtitle{color:#94a3b8;}
.module.locked .mstatus{
  background:#eef2ff;color:#a5b4fc;
}

/* 底部 */
.footer-note{
  background:#fff;border:1.5px solid #e8eeff;border-radius:18px;
  padding:18px 22px;text-align:center;font-size:13px;
  color:#64748b;line-height:1.9;box-shadow:0 8px 24px rgba(99,102,241,.06);
}
.footer-note b{color:#6366f1;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="icon">
      <svg viewBox="0 0 64 64" width="56" height="56">
        <defs>
          <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
          </linearGradient>
        </defs>
        <path d="M26 8 L26 26 L14 50 Q13 54 17 54 L47 54 Q51 54 50 50 L38 26 L38 8 Z"
              fill="url(#flaskGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="24" y1="8" x2="40" y2="8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="44" r="2.5" fill="#a855f7"/>
        <circle cx="34" cy="48" r="2" fill="#ec4899"/>
        <circle cx="40" cy="42" r="2.2" fill="#6366f1"/>
      </svg>
    </div>
    <h1>无机化学 特训道场</h1>
    <div class="sub">無機化学 特訓道場</div>
    <p>选择一个模块开始特训<br>每个模块 10 道题，7 分以上合格</p>
  </div>

  <div class="statrow">
    <div class="statbox"><b>14</b><small>知识模块</small></div>
    <div class="statbox"><b>1</b><small>已开放</small></div>
    <div class="statbox"><b>7</b><small>合格线</small></div>
  </div>

  <div class="section-title">
    <span class="bar"></span>
    非金属元素
    <small>非金属元素</small>
  </div>
  <div class="grid" id="gridNonmetal"></div>

  <div class="section-title">
    <span class="bar"></span>
    典型金属元素
    <small>典型金属元素</small>
  </div>
  <div class="grid" id="gridMetal"></div>

  <div class="section-title">
    <span class="bar"></span>
    遷移金属元素
    <small>过渡金属元素</small>
  </div>
  <div class="grid" id="gridTransition"></div>

  <div class="section-title">
    <span class="bar"></span>
    综合
    <small>まとめ</small>
  </div>
  <div class="grid" id="gridSummary"></div>

  <div class="footer-note">
    💡 每个模块点进去后，先可以查看<b>知识要点</b>，再开始答题。<br>
    ⚠️ 答题过程中知识要点会锁定，答完返回首页即可重新查看。
  </div>

</div>

<script>
/* =====================================================================
   SVG 图标生成
   ===================================================================== */

/* 元素符号圆形图标 */
function atomIcon(symbol, color){
  return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="24" fill="${color}" opacity="0.14"/>
    <circle cx="26" cy="26" r="18" fill="none" stroke="${color}" stroke-width="1.6" opacity="0.5"/>
    <circle cx="26" cy="26" r="5" fill="${color}" opacity="0.85"/>
    <ellipse cx="26" cy="26" rx="22" ry="9" fill="none" stroke="${color}" stroke-width="1.4" opacity="0.55" transform="rotate(-30 26 26)"/>
    <text x="26" y="44" text-anchor="middle"
          font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900"
          fill="${color}">${symbol}</text>
  </svg>`;
}

/* 双元素符号图标 */
function dualAtomIcon(s1, s2, color){
  return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="24" fill="${color}" opacity="0.14"/>
    <circle cx="18" cy="22" r="10" fill="${color}" opacity="0.28"/>
    <circle cx="36" cy="30" r="10" fill="${color}" opacity="0.28"/>
    <text x="18" y="26" text-anchor="middle"
          font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900"
          fill="${color}">${s1}</text>
    <text x="36" y="34" text-anchor="middle"
          font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="900"
          fill="${color}">${s2}</text>
  </svg>`;
}

/* 气体/气球图标 */
function gasIcon(color){
  return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="24" fill="${color}" opacity="0.14"/>
    <ellipse cx="26" cy="21" rx="13" ry="15" fill="${color}" opacity="0.35"/>
    <path d="M23 36 Q22 42 24 44 Q25 45 26 45 Q27 45 28 44 Q30 42 29 36 Z"
          fill="${color}" opacity="0.55"/>
    <ellipse cx="21" cy="16" rx="3" ry="4" fill="#ffffff" opacity="0.55"/>
  </svg>`;
}

/* 钻石/晶体图标 */
function crystalIcon(color){
  return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="24" fill="${color}" opacity="0.14"/>
    <path d="M26 8 L38 20 L32 42 L20 42 L14 20 Z"
          fill="${color}" opacity="0.32" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="14" y1="20" x2="38" y2="20" stroke="${color}" stroke-width="1.4" opacity="0.6"/>
    <line x1="26" y1="8" x2="26" y2="42" stroke="${color}" stroke-width="1.4" opacity="0.6"/>
  </svg>`;
}

/* 齿轮图标（两性金属） */
function gearIcon(color){
  return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="24" fill="${color}" opacity="0.14"/>
    <path d="M26 10 L28.5 15 L34 13.5 L35.5 19 L41 20.5 L39.5 26 L41 31.5 L35.5 33 L34 38.5 L28.5 37 L26 42 L23.5 37 L18 38.5 L16.5 33 L11 31.5 L12.5 26 L11 20.5 L16.5 19 L18 13.5 L23.5 15 Z"
          fill="${color}" opacity="0.35" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="26" cy="26" r="5.5" fill="#fff"/>
    <circle cx="26" cy="26" r="4" fill="${color}" opacity="0.55"/>
  </svg>`;
}

/* 芯片图标（生活中的过渡金属） */
function chipIcon(color){
  return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="24" fill="${color}" opacity="0.14"/>
    <rect x="15" y="15" width="22" height="22" rx="3"
          fill="${color}" opacity="0.3" stroke="${color}" stroke-width="1.6"/>
    <rect x="21" y="21" width="10" height="10" rx="1.5"
          fill="${color}" opacity="0.65"/>
    <g stroke="${color}" stroke-width="1.5" opacity="0.7">
      <line x1="20" y1="10" x2="20" y2="15"/>
      <line x1="26" y1="10" x2="26" y2="15"/>
      <line x1="32" y1="10" x2="32" y2="15"/>
      <line x1="20" y1="37" x2="20" y2="42"/>
      <line x1="26" y1="37" x2="26" y2="42"/>
      <line x1="32" y1="37" x2="32" y2="42"/>
      <line x1="10" y1="20" x2="15" y2="20"/>
      <line x1="10" y1="26" x2="15" y2="26"/>
      <line x1="10" y1="32" x2="15" y2="32"/>
      <line x1="37" y1="20" x2="42" y2="20"/>
      <line x1="37" y1="26" x2="42" y2="26"/>
      <line x1="37" y1="32" x2="42" y2="32"/>
    </g>
  </svg>`;
}

/* 奖杯图标（综合） */
function trophyIcon(color){
  return `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
    <circle cx="26" cy="26" r="24" fill="${color}" opacity="0.14"/>
    <path d="M17 12 L35 12 L35 22 Q35 30 26 32 Q17 30 17 22 Z"
          fill="${color}" opacity="0.35" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M14 14 Q10 14 10 19 Q10 24 15 24" fill="none" stroke="${color}" stroke-width="1.6"/>
    <path d="M38 14 Q42 14 42 19 Q42 24 37 24" fill="none" stroke="${color}" stroke-width="1.6"/>
    <line x1="26" y1="32" x2="26" y2="38" stroke="${color}" stroke-width="2"/>
    <rect x="20" y="38" width="12" height="3.5" rx="1.5" fill="${color}" opacity="0.6"/>
  </svg>`;
}

/* =====================================================================
   模块列表（★ 氢与稀有气体链接已改为 H+He.html）
   ===================================================================== */
const MODULES = {
  nonmetal: [
    { key:'hydrogen', title:'水素と希ガス', cn:'氢与稀有气体', status:'open', href:'H+He.html',
      icon: atomIcon('H','#0ea5e9') },
    { key:'halogen',  title:'ハロゲン',     cn:'卤素',         status:'locked',
      icon: atomIcon('Cl','#10b981') },
    { key:'oxygens',  title:'酸素と硫黄',   cn:'氧与硫',       status:'locked',
      icon: dualAtomIcon('O','S','#f59e0b') },
    { key:'nitrogen', title:'窒素とリン',   cn:'氮与磷',       status:'locked',
      icon: dualAtomIcon('N','P','#8b5cf6') },
    { key:'carbon',   title:'炭素とケイ素', cn:'碳与硅',       status:'locked',
      icon: crystalIcon('#3b82f6') },
    { key:'gas',      title:'気体性質総合', cn:'气体性质总合', status:'locked',
      icon: gasIcon('#06b6d4') }
  ],
  metal: [
    { key:'alkali',    title:'アルカリ金属',     cn:'碱金属',   status:'locked',
      icon: atomIcon('Na','#ef4444') },
    { key:'alkaline',  title:'アルカリ土類金属', cn:'碱土金属', status:'locked',
      icon: atomIcon('Ca','#f97316') },
    { key:'amphoteric',title:'両性金属',         cn:'两性金属', status:'locked',
      icon: gearIcon('#a855f7') }
  ],
  transition: [
    { key:'iron',      title:'鉄',               cn:'铁',             status:'locked',
      icon: atomIcon('Fe','#64748b') },
    { key:'copper',    title:'銅と銀',           cn:'铜与银',         status:'locked',
      icon: dualAtomIcon('Cu','Ag','#b45309') },
    { key:'chromium',  title:'クロムとマンガン', cn:'铬与锰',         status:'locked',
      icon: dualAtomIcon('Cr','Mn','#c026d3') },
    { key:'daily',     title:'生活中の遷移金属', cn:'生活中的过渡金属', status:'locked',
      icon: chipIcon('#1d4ed8') }
  ],
  summary: [
    { key:'all', title:'無機総合', cn:'无机综合', status:'locked',
      icon: trophyIcon('#eab308') }
  ]
};

/* =====================================================================
   渲染
   ===================================================================== */
function renderModule(m){
  const cls = m.status === 'open' ? 'open' : 'locked';
  const statusText = m.status === 'open' ? '▶ 开始答题' : '🔒 即将开放';
  const tag = m.status === 'open' ? 'button' : 'div';
  // ★ 用 encodeURI 处理文件名里的 + 号，避免被解析成空格
  const onclick = m.status === 'open'
    ? `onclick="location.href=encodeURI('${m.href}')"`
    : '';

  return `<${tag} class="module ${cls}" ${onclick}>
    <div class="micon">${m.icon}</div>
    <div class="mtitle">${m.title}</div>
    <div class="mcn">${m.cn}</div>
    <div class="mstatus">${statusText}</div>
  </${tag}>`;
}

function renderGroup(id, list){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = list.map(renderModule).join('');
}

renderGroup('gridNonmetal',   MODULES.nonmetal);
renderGroup('gridMetal',      MODULES.metal);
renderGroup('gridTransition', MODULES.transition);
renderGroup('gridSummary',    MODULES.summary);
</script>
</body>
</html>
